# vim: set ft=conf tw=79 nu ai et ts=2 sw=2:
#------------------------------------------------------------------------------
# Author: 00riddle00 (Tomas Giedraitis)
# Date:   2026-08-11 19:24:27 CEST
# Path:   ~/.config/picom/picom.conf
# URL:    https://github.com/00riddle00/dotfiles
#------------------------------------------------------------------------------

#----------------------------------
# Shadows
#----------------------------------

shadow          = true;
shadow-radius   = 10;
shadow-opacity  = 0.6;
shadow-offset-x = -5;
shadow-offset-y = -5;
# Overrides shadow-{red,green,blue}:
shadow-color    = "#000000";

shadow-exclude = [
  "name    =  'Notification'",
  "class_g =  'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g =  'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@"
];

crop-shadow-to-monitor = false;

#----------------------------------
# Fading
#----------------------------------

fading                   = true;
# For slower fading use 0.03 or 0.05
fade-in-step             = 0.15;
fade-out-step            = 0.15;
fade-delta               = 5;
fade-exclude             = [ ];
no-fading-openclose      = false;
no-fading-destroyed-argb = false;

#----------------------------------
# Transparency / Opacity
#----------------------------------

#inactive-opacity          = 0.9;
#frame-opacity             = 0.7;
#inactive-opacity-override = false;
#active-opacity            = 0.9;
#inactive-dim              = 0.1;
#focus-exclude             = [ "class_g = 'Cairo-clock'" ];
#inactive-dim-fixed        = 1.0;
#opacity-rule              = [ "90:class_g = 'kitty'" ];

#----------------------------------
# Corners
#----------------------------------

corner-radius = 10.0;
# Set to true for i3 rounded
round-borders = false;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#----------------------------------
# Background-Blurring
#----------------------------------

blur-method           = "dual_kawase";
blur-size             = 12;
blur-strength         = 7;
# `blur-background = true` and `blur-background-frame = true` starts
# lagging with xrender (Date: 2020-02-21 23:11:34 EET).
blur-background       = false;
blur-background-frame = false;
blur-background-fixed = false;

# Optional fallback blur-kern
# blur-kern           = "3x3box";

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@"
];

#----------------------------------
# General Settings
#----------------------------------

dbus                        = true;
daemon                      = false;
# Consider "xrender" if GLX gives issues.
backend                     = "glx";
vsync                       = true;
mark-wmwin-focused          = true;
# [1] This is mostly for override-redirect windows (some popups/menus). On some setups
# it can cause “focus weirdness” with menus/tooltips. If no focus weirdness is observed,
# keep this enabled (true).
mark-ovredir-focused        = false;
detect-rounded-corners      = true;
detect-client-opacity       = true;
use-ewmh-active-win         = false;
# [2] Set to 'false' if you ever see flicker/weirdness with certain apps (or games!)
unredir-if-possible         = false;
unredir-if-possible-delay   = 0;
unredir-if-possible-exclude = [];
detect-transient            = true;
detect-client-leader        = true;
invert-color-include        = [];
# [3] Set to 'false' if you ever see flicker/weirdness with certain apps
use-damage                  = false;
xrender-sync-fence          = false;

force-win-blend              = false;
no-ewmh-fullscreen           = false;
max-brightness               = 1.0;
transparent-clipping         = false;
transparent-clipping-exclude = [];
log-level                    = "warn";
show-all-xerrors             = false;

wintypes:
{
  tooltip = {
    fade        = true;
    shadow      = true;
    opacity     = 0.75;
    focus       = true;
    full-shadow = false;
  };
  dock = {
    shadow            = false;
    clip-shadow-above = true;
    opacity           = 0.95;
  };
  dnd = {
    shadow = false;
  };
  popup_menu = {
    opacity = 0.8;
  };
  dropdown_menu = {
    opacity = 0.8;
  };
};
