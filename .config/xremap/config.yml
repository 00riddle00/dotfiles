modmap:
  - name: CapsLock to Escape
    device: &kb_allow
      only:
        - "AT Translated Set 2 keyboard"
        - "BlackWidow Tournament"
        - "BlackWidow V3 Tenkeyless"
        - "Ducky One 3 TKL"
    remap:
      CapsLock: Esc

keymap:
  - name: Paste with Alt-v
    application:
      only:
        - brave-browser
        - Brave-browser
        - brave
        - Brave
        - firefox
        - Firefox
        - obsidian
        - Obsidian
    device: *kb_allow
    remap:
      Alt-v: C-v
